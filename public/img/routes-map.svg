<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Abstract shipping route lines connecting dots (cities) -->
  <!-- Dots representing major shipping hubs -->
  <circle cx="120" cy="160" r="3" fill="#2997ff" opacity="0.6"/><!-- New York -->
  <circle cx="95" cy="200" r="2" fill="#2997ff" opacity="0.4"/><!-- Miami -->
  <circle cx="340" cy="140" r="3" fill="#2997ff" opacity="0.5"/><!-- London -->
  <circle cx="360" cy="160" r="2" fill="#2997ff" opacity="0.4"/><!-- Paris -->
  <circle cx="380" cy="150" r="2.5" fill="#2997ff" opacity="0.5"/><!-- Frankfurt -->
  <circle cx="420" cy="200" r="2" fill="#2997ff" opacity="0.3"/><!-- Dubai -->
  <circle cx="540" cy="170" r="3" fill="#2997ff" opacity="0.5"/><!-- Mumbai -->
  <circle cx="620" cy="140" r="2.5" fill="#2997ff" opacity="0.4"/><!-- Shanghai -->
  <circle cx="660" cy="130" r="3" fill="#2997ff" opacity="0.6"/><!-- Tokyo -->
  <circle cx="650" cy="160" r="2" fill="#2997ff" opacity="0.3"/><!-- Seoul -->
  <circle cx="590" cy="220" r="2" fill="#2997ff" opacity="0.3"/><!-- Singapore -->
  <circle cx="700" cy="300" r="2.5" fill="#2997ff" opacity="0.4"/><!-- Sydney -->
  <circle cx="150" cy="280" r="2" fill="#2997ff" opacity="0.3"/><!-- São Paulo -->

  <!-- Route curves -->
  <path d="M120 160 Q230 100 340 140" stroke="#2997ff" stroke-width="1" opacity="0.15"/>
  <path d="M340 140 Q460 110 620 140" stroke="#2997ff" stroke-width="1" opacity="0.12"/>
  <path d="M120 160 Q400 80 660 130" stroke="#2997ff" stroke-width="0.8" opacity="0.08"/>
  <path d="M340 140 Q380 180 420 200" stroke="#2997ff" stroke-width="0.8" opacity="0.1"/>
  <path d="M420 200 Q480 185 540 170" stroke="#2997ff" stroke-width="0.8" opacity="0.1"/>
  <path d="M540 170 Q580 195 590 220" stroke="#2997ff" stroke-width="0.8" opacity="0.08"/>
  <path d="M620 140 Q630 150 650 160" stroke="#2997ff" stroke-width="0.8" opacity="0.1"/>
  <path d="M590 220 Q645 260 700 300" stroke="#2997ff" stroke-width="0.8" opacity="0.08"/>
  <path d="M120 160 Q135 220 150 280" stroke="#2997ff" stroke-width="0.8" opacity="0.08"/>
  <path d="M150 280 Q250 210 340 140" stroke="#2997ff" stroke-width="0.8" opacity="0.06"/>
  <path d="M660 130 Q680 210 700 300" stroke="#2997ff" stroke-width="0.8" opacity="0.08"/>
  <path d="M95 200 Q200 260 340 140" stroke="#2997ff" stroke-width="0.6" opacity="0.06"/>
  <path d="M380 150 Q500 130 620 140" stroke="#2997ff" stroke-width="0.6" opacity="0.08"/>

  <!-- Subtle glow on major hubs -->
  <circle cx="120" cy="160" r="12" fill="#2997ff" opacity="0.05"/>
  <circle cx="340" cy="140" r="10" fill="#2997ff" opacity="0.04"/>
  <circle cx="660" cy="130" r="10" fill="#2997ff" opacity="0.04"/>
  <circle cx="620" cy="140" r="8" fill="#2997ff" opacity="0.03"/>
</svg>
