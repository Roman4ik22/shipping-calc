<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Data collection network visualization -->
  <!-- Central node -->
  <circle cx="200" cy="150" r="6" fill="#2997ff" opacity="0.5"/>
  <circle cx="200" cy="150" r="20" stroke="#2997ff" stroke-width="0.5" opacity="0.1"/>
  <circle cx="200" cy="150" r="40" stroke="#2997ff" stroke-width="0.5" opacity="0.06"/>

  <!-- Carrier source nodes scattered organically -->
  <circle cx="80" cy="80" r="3" fill="#2997ff" opacity="0.3"/>
  <circle cx="320" cy="70" r="4" fill="#2997ff" opacity="0.35"/>
  <circle cx="60" cy="180" r="2.5" fill="#2997ff" opacity="0.25"/>
  <circle cx="340" cy="200" r="3" fill="#2997ff" opacity="0.3"/>
  <circle cx="150" cy="50" r="2" fill="#2997ff" opacity="0.2"/>
  <circle cx="280" cy="250" r="2.5" fill="#2997ff" opacity="0.25"/>
  <circle cx="100" cy="250" r="3" fill="#2997ff" opacity="0.3"/>
  <circle cx="350" cy="130" r="2" fill="#2997ff" opacity="0.2"/>
  <circle cx="130" cy="140" r="2" fill="#2997ff" opacity="0.15"/>
  <circle cx="290" cy="120" r="2.5" fill="#2997ff" opacity="0.2"/>

  <!-- Connection lines to center -->
  <line x1="80" y1="80" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.08"/>
  <line x1="320" y1="70" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.08"/>
  <line x1="60" y1="180" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.06"/>
  <line x1="340" y1="200" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.08"/>
  <line x1="150" y1="50" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.06"/>
  <line x1="280" y1="250" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.06"/>
  <line x1="100" y1="250" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.08"/>
  <line x1="350" y1="130" x2="200" y2="150" stroke="#2997ff" stroke-width="0.5" opacity="0.06"/>

  <!-- Labels -->
  <text x="70" y="72" fill="#2997ff" opacity="0.2" font-size="8" font-family="Inter, sans-serif">DHL</text>
  <text x="310" y="62" fill="#2997ff" opacity="0.2" font-size="8" font-family="Inter, sans-serif">FedEx</text>
  <text x="45" y="175" fill="#2997ff" opacity="0.15" font-size="7" font-family="Inter, sans-serif">EMS</text>
  <text x="330" y="195" fill="#2997ff" opacity="0.15" font-size="7" font-family="Inter, sans-serif">UPS</text>
  <text x="88" y="245" fill="#2997ff" opacity="0.15" font-size="7" font-family="Inter, sans-serif">Aramex</text>
  <text x="340" y="125" fill="#2997ff" opacity="0.12" font-size="7" font-family="Inter, sans-serif">USPS</text>
</svg>
